[project]
name = "docmesh-kbms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dms-core>=0.11.0",
    "ollama>=0.6.2",
    "pymilvus[milvus-lite]>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.setuptools.packages.find]
include = ["kbms*"]
exclude = []

[tool.pytest.ini_options]
testpaths = ["test_kbms"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = []
